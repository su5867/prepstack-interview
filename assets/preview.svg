  <g transform="translate(800,110)">
    <text x="0" y="0" font-family="Poppins, sans-serif" font-size="40" font-weight="700" fill="#FFFFFF">PrepStack</text>
    <text x="0" y="40" font-family="Inter, sans-serif" font-size="17" fill="#B9C6E3">Interview prep tracker for</text>
