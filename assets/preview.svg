    <line x1="0" y1="470" x2="300" y2="470" stroke="#D8E6F9" stroke-width="2"/>
    <circle cx="60" cy="495" r="5" fill="#1D3868"/>
    <circle cx="130" cy="495" r="5" fill="#C7CEDB"/>
    <circle cx="200" cy="495" r="5" fill="#C7CEDB"/>
    <circle cx="240" cy="495" r="5" fill="#C7CEDB"/>
