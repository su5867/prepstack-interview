    <rect x="0" y="86" width="300" height="34" fill="url(#hdr)"/>
    <circle cx="46" cy="60" r="20" fill="#F0B23C"/>
    <text x="46" y="66" font-family="Poppins, sans-serif" font-size="16" font-weight="700" fill="#0E1F3D" text-anchor="middle">SD</text>
    <rect x="76" y="48" width="130" height="10" rx="5" fill="#FFFFFF" opacity="0.9"/>
    <rect x="76" y="64" width="150" height="8" rx="4" fill="#FFFFFF" opacity="0.5"/>

    <!-- list rows -->
    <g font-family="Inter, sans-serif">
      <rect x="24" y="150" width="252" height="46" rx="10" fill="#EAF2FC"/>
      <rect x="36" y="163" width="120" height="9" rx="4" fill="#16233F"/>
      <rect x="36" y="177" width="90" height="7" rx="3" fill="#7C879D"/>
      <rect x="220" y="164" width="42" height="18" rx="9" fill="#E1F5EE"/>

      <rect x="24" y="204" width="252" height="46" rx="10" fill="#F6F9FF"/>
      <rect x="36" y="217" width="140" height="9" rx="4" fill="#16233F"/>
      <rect x="36" y="231" width="80" height="7" rx="3" fill="#7C879D"/>
      <rect x="220" y="218" width="42" height="18" rx="9" fill="#FDF1DC"/>

      <rect x="24" y="258" width="252" height="46" rx="10" fill="#F6F9FF"/>
      <rect x="36" y="271" width="110" height="9" rx="4" fill="#16233F"/>
      <rect x="36" y="285" width="100" height="7" rx="3" fill="#7C879D"/>
      <rect x="220" y="272" width="42" height="18" rx="9" fill="#FBE7E7"/>
