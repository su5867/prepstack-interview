    <text x="24" y="60" font-family="Inter, sans-serif" font-size="12" fill="#7C879D">Your prep at a glance</text>

    <rect x="24" y="78" width="90" height="54" rx="10" fill="#EAF2FC"/>
    <text x="69" y="106" font-family="Poppins, sans-serif" font-size="18" font-weight="700" fill="#0E1F3D" text-anchor="middle">18/24</text>
    <text x="69" y="122" font-family="Inter, sans-serif" font-size="9" fill="#7C879D" text-anchor="middle">Solved</text>

    <rect x="124" y="78" width="90" height="54" rx="10" fill="#EAF2FC"/>
    <text x="169" y="106" font-family="Poppins, sans-serif" font-size="18" font-weight="700" fill="#0E1F3D" text-anchor="middle">75%</text>
    <text x="169" y="122" font-family="Inter, sans-serif" font-size="9" fill="#7C879D" text-anchor="middle">Success</text>

    <rect x="224" y="78" width="90" height="54" rx="10" fill="#EAF2FC"/>
    <text x="269" y="106" font-family="Poppins, sans-serif" font-size="18" font-weight="700" fill="#0E1F3D" text-anchor="middle">12🔥</text>
    <text x="269" y="122" font-family="Inter, sans-serif" font-size="9" fill="#7C879D" text-anchor="middle">Streak</text>

    <rect x="24" y="150" width="282" height="14" rx="7" fill="#EAF2FC"/>
    <rect x="24" y="150" width="220" height="14" rx="7" fill="#1F9C7E"/>
    <rect x="24" y="172" width="282" height="14" rx="7" fill="#EAF2FC"/>
    <rect x="24" y="172" width="140" height="14" rx="7" fill="#F0B23C"/>
  </g>

  <!-- Resources card -->
  <g transform="translate(430,330)">
    <rect x="0" y="0" width="330" height="170" rx="18" fill="#FFFFFF"/>
    <text x="24" y="36" font-family="Poppins, sans-serif" font-size="18" font-weight="700" fill="#16233F">Resources</text>
    <rect x="24" y="54" width="282" height="34" rx="8" fill="#F6F9FF"/>
    <text x="34" y="75" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#16233F">NeetCode 150 roadmap</text>
    <rect x="24" y="94" width="282" height="34" rx="8" fill="#F6F9FF"/>
    <text x="34" y="115" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#16233F">System Design Primer</text>
