      <circle cx="6" cy="26" r="3" fill="#1F9C7E"/><text x="18" y="30">System design &amp; behavioral prep</text>
      <circle cx="6" cy="56" r="3" fill="#E5484D"/><text x="18" y="60">Mock interviews &amp; study plan</text>
      <circle cx="6" cy="86" r="3" fill="#F0B23C"/><text x="18" y="90">Progress tracking &amp; backups</text>
